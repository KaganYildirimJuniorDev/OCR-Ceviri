<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR Çeviri Ayarları</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="icon.png" alt="OCR Logo" class="logo-img">
        <div class="brand-text">
          <span class="title">OCR Çeviri</span>
          <span class="sub-title">by auxy</span>
        </div>
      </div>
      <span class="badge">v1.0</span>
    </header>

    <!-- Main Content -->
    <main class="content">
      <!-- Language Selection Grid -->
      <div class="lang-grid">
        <div class="form-group">
          <label for="sourceLang">Kaynak Dil</label>
          <select id="sourceLang" class="custom-select">
            <option value="auto">Otomatik ✨</option>
            <option value="tr">Türkçe 🇹🇷</option>
            <option value="en">İngilizce 🇬🇧</option>
            <option value="de">Almanca 🇩🇪</option>
            <option value="fr">Fransızca 🇫🇷</option>
            <option value="es">İspanyolca 🇪🇸</option>
            <option value="it">İtalyanca 🇮🇹</option>
            <option value="ru">Rusça 🇷🇺</option>
            <option value="ja">Japonca 🇯🇵</option>
            <option value="ko">Korece 🇰🇷</option>
            <option value="zh">Çince 🇨🇳</option>
          </select>
        </div>
        <div class="form-group">
          <label for="targetLang">Hedef Dil</label>
          <select id="targetLang" class="custom-select">
            <option value="tr">Türkçe 🇹🇷</option>
            <option value="en">İngilizce 🇬🇧</option>
            <option value="de">Almanca 🇩🇪</option>
            <option value="fr">Fransızca 🇫🇷</option>
            <option value="es">İspanyolca 🇪🇸</option>
            <option value="it">İtalyanca 🇮🇹</option>
            <option value="ru">Rusça 🇷🇺</option>
            <option value="ja">Japonca 🇯🇵</option>
            <option value="ko">Korece 🇰🇷</option>
            <option value="zh">Çince 🇨🇳</option>
          </select>
        </div>
      </div>

      <!-- Mode Selector -->
      <div class="form-group">
        <label>Çeviri Modu</label>
        <div class="mode-grid">
          <button type="button" class="mode-btn active" data-mode="auto">
            <span class="icon">✨</span>
            <span class="label">Otomatik</span>
          </button>
          <button type="button" class="mode-btn" data-mode="dictionary">
            <span class="icon">📖</span>
            <span class="label">Sözlük</span>
          </button>
          <button type="button" class="mode-btn" data-mode="inpainting">
            <span class="icon">🎨</span>
            <span class="label">In-Painting</span>
          </button>
          <button type="button" class="mode-btn" data-mode="live">
            <span class="icon">📺</span>
            <span class="label">Canlı Altyazı</span>
          </button>
        </div>
      </div>

      <!-- Dinamik Başlatma Butonu -->
      <button id="startBtn" class="primary-btn">
        <span id="startBtnIcon" class="btn-svg-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="12" cy="12" r="10" />
            <path d="M12 8v8M8 12h8" />
          </svg>
        </span>
        <span id="startBtnText">Ekranda Alan Seç</span>
        <span class="shortcut-tip">Ctrl+Shift+S</span>
      </button>

      <!-- History Section -->
      <section class="history-section">
        <div class="history-header">
          <span>Son Çeviriler</span>
          <button id="clearHistoryBtn" class="text-btn">Temizle</button>
        </div>
        <div id="historyList" class="history-list">
          <div class="empty-state">Henüz geçmiş kayıt yok.</div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span>OCR Çeviri v1.0 • by auxy</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>

</html>
